<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: navy utility strip → glass header → deep-navy hero with a cut-out doctor lineup (Dr. Fatima centre) → floating doctor finder → featured physician panel → doctor grid with profile dialog → departments → contact → footer.
   Palette from the hospital posters and logo: poster royal blue, deep navy, poster sky-blue swoosh as the secondary accent, logo red only for emergency. */
:root{
  --navy:#081a40; --navy-2:#0c2a63; --royal:#0f4993; --sky:#29a3dd; --sky-soft:#e6f4fb;
  --red:#d7261e; --red-soft:#fdecea;
  --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f8f9fc; --line:#e2e7f0; --text:#0d1630; --muted:#5a6580;
  --brand:#0f4993; --brand-soft:#eaf0fa; --on-brand:#ffffff;
  --ph-a:#ffffff; --ph-b:#dbe5f4;
  --care:#1f9d6f;
  --shadow:0 24px 60px -30px rgba(8,26,64,.45);
  --display:"Noto Kufi Arabic","Manrope",system-ui,sans-serif;
  --body:"Noto Sans Arabic","Manrope",system-ui,sans-serif;
  --latin:"Manrope","Noto Sans Arabic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#070d1d;--surface:#0f172c;--surface-2:#131d36;--line:#1f2a45;--text:#eef1f8;--muted:#9aa5bf;
  --brand:#7fa6f0;--brand-soft:#15224a;--sky-soft:#0f2a3b;--red-soft:#3a1716;--red:#ec5048;
  --ph-a:#1b2d58;--ph-b:#0c1733;--care:#3fc28f;--shadow:0 24px 60px -30px rgba(0,0,0,.8);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#070d1d;--surface:#0f172c;--surface-2:#131d36;--line:#1f2a45;--text:#eef1f8;--muted:#9aa5bf;
  --brand:#7fa6f0;--brand-soft:#15224a;--sky-soft:#0f2a3b;--red-soft:#3a1716;--red:#ec5048;
  --ph-a:#1b2d58;--ph-b:#0c1733;--care:#3fc28f;--shadow:0 24px 60px -30px rgba(0,0,0,.8);color-scheme:dark}
html[lang="en"]{--display:var(--latin);--body:var(--latin)}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
a{color:inherit}
:focus-visible{outline:2px solid var(--sky);outline-offset:3px;border-radius:8px}
.num{font-family:var(--latin);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
svg{flex-shrink:0}

/* utility strip */
.util{background:var(--navy);color:#b9c4e0;font-size:13px}
.util .wrap{display:flex;gap:24px;align-items:center;padding-block:8px;white-space:nowrap}
.util span{display:inline-flex;align-items:center;gap:7px}
.util svg{width:14px;height:14px;opacity:.75}
.util .end{margin-inline-start:auto}
.dot{width:7px;height:7px;border-radius:50%;background:#3fc28f;box-shadow:0 0 0 3px rgba(63,194,143,.25)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:28px;padding-block:12px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;min-width:0;margin-inline-end:auto}
.brand img{width:48px;height:48px;border-radius:50%;display:block;flex-shrink:0;box-shadow:0 0 0 1px var(--line)}
.brand b{display:block;font-family:var(--display);font-size:16.5px;font-weight:700;line-height:1.35;color:var(--text);white-space:nowrap}
.brand small{display:block;font:700 10px/1.3 var(--latin);letter-spacing:.16em;color:var(--brand)}
.nav{display:flex;gap:2px}
.nav a{text-decoration:none;font-size:15px;font-weight:500;color:var(--muted);padding:8px 13px;border-radius:9px}
.nav a:hover{color:var(--text);background:var(--surface-2)}
.langs{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;flex-shrink:0}
.langs button{all:unset;cursor:pointer;font:600 13px/1 var(--body);padding:8px 11px;border-radius:8px;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(8,26,64,.14)}
.langs button:focus-visible{outline:2px solid var(--sky)}
.er{display:inline-flex;align-items:center;gap:9px;background:var(--red);color:#fff;text-decoration:none;font-weight:700;font-size:14px;padding:11px 16px;border-radius:11px;flex-shrink:0;box-shadow:0 8px 20px -10px rgba(215,38,30,.7)}
.er svg{width:16px;height:16px}

/* hero */
.hero{position:relative;overflow:hidden;color:#fff;
  background:radial-gradient(60% 80% at 78% 30%,rgba(41,163,221,.28),transparent 60%),radial-gradient(70% 90% at 20% 110%,rgba(15,73,147,.9),transparent 60%),linear-gradient(160deg,#0c2a63 0%,#081a40 70%)}
html[dir="rtl"] .hero{background:radial-gradient(60% 80% at 22% 30%,rgba(41,163,221,.28),transparent 60%),radial-gradient(70% 90% at 80% 110%,rgba(15,73,147,.9),transparent 60%),linear-gradient(200deg,#0c2a63 0%,#081a40 70%)}
.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:56px 56px;mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent);-webkit-mask-image:radial-gradient(70% 70% at 50% 40%,#000,transparent)}
.hero .wrap{position:relative;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.08fr);gap:24px;align-items:end;min-height:560px}
.hero .copy{padding-block:72px 120px;align-self:center}
.pill{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#d6e4fb;font-size:13px;font-weight:600;padding:7px 13px;border-radius:999px}
.pill i{width:6px;height:6px;border-radius:50%;background:var(--sky)}
.hero h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.8vw,56px);line-height:1.28;margin:20px 0 18px;text-wrap:balance}
html[lang="en"] .hero h1{font-weight:800;letter-spacing:-.03em;line-height:1.06}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,#7cd0f5,#ffffff);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:#b8c6e4;font-size:17.5px;max-width:31em;margin:0 0 32px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 22px;border-radius:12px;font-weight:600;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;font-family:inherit;line-height:1.2;transition:transform .2s,filter .2s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn svg{width:17px;height:17px}
.btn-white{background:#fff;color:#081a40}
.btn-glass{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.btn-glass:hover{background:rgba(255,255,255,.14)}
.btn-pri{background:var(--royal);color:#fff}
.btn-pri:hover{filter:brightness(1.12)}
.btn-sec{background:var(--surface);border-color:var(--line);color:var(--text)}
.btn-sec:hover{border-color:var(--brand)}

.lineup{position:relative;display:flex;justify-content:center;align-items:flex-end;height:520px;align-self:end}
.lineup::before{content:"";position:absolute;bottom:-30%;left:50%;transform:translateX(-50%);width:110%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(41,163,221,.35),transparent 62%)}
.lineup img{position:relative;display:block;height:78%;width:auto;max-width:none;margin-inline:-9%;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35)) brightness(.9);animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.lineup img.c{height:100%;z-index:3;filter:drop-shadow(0 24px 36px rgba(0,0,0,.45));animation-delay:.05s}
.lineup img.m{height:88%;z-index:2;filter:drop-shadow(0 20px 30px rgba(0,0,0,.35)) brightness(.95);animation-delay:.15s}
.lineup img.o{z-index:1;animation-delay:.25s}
@keyframes up{from{transform:translateY(18px)}to{transform:none}}
.nametag{position:absolute;z-index:4;bottom:96px;inset-inline-end:2%;background:rgba(8,26,64,.6);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:2px;max-width:250px}
.nametag b{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.4}
.nametag span{font-size:12.5px;color:#b8c6e4;line-height:1.45}

/* finder */
.finder-wrap{position:relative;z-index:5;margin-top:-64px}
.finder{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto minmax(0,.9fr);align-items:stretch}
.finder .f{padding:18px 22px;display:flex;flex-direction:column;gap:4px;min-width:0}
.finder .f+.f{border-inline-start:1px solid var(--line)}
.finder label{font-size:12.5px;font-weight:700;color:var(--muted)}
.finder select,.finder input{all:unset;font:600 16px/1.5 var(--body);color:var(--text);width:100%;cursor:pointer}
.finder input{cursor:text}
.finder input::placeholder{color:var(--muted);font-weight:500;opacity:.8}
.finder select:focus-visible,.finder input:focus-visible{outline:2px solid var(--sky);outline-offset:4px;border-radius:4px}
.finder .go{display:flex;align-items:center;padding:12px}
.finder .go .btn{height:100%;padding-inline:24px}
.finder .erbox{display:flex;align-items:center;gap:14px;padding:16px 22px;background:var(--red-soft);border-start-end-radius:19px;border-end-end-radius:19px}
.erbox .i{width:44px;height:44px;border-radius:12px;background:var(--red);color:#fff;display:grid;place-items:center}
.erbox .i svg{width:20px;height:20px}
.erbox small{display:block;font-size:12.5px;color:var(--muted);line-height:1.35}
.erbox a{display:block;font:800 19px/1.3 var(--latin);font-variant-numeric:tabular-nums;direction:ltr;text-decoration:none;color:var(--text)}
html[dir="rtl"] .erbox a{text-align:right}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;margin-top:44px}
.stat{padding-inline:24px;border-inline-start:1px solid var(--line)}
.stat:first-child{border-inline-start:0;padding-inline-start:0}
.stat b{display:block;font:800 34px/1.1 var(--latin);color:var(--brand);letter-spacing:-.02em}
.stat span{display:block;color:var(--muted);font-size:14px;margin-top:6px}

/* sections */
section{padding-block:88px}
.head{display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap;margin-bottom:34px}
.kicker{display:inline-flex;align-items:center;gap:10px;color:var(--brand);font-size:13.5px;font-weight:700;margin-bottom:8px}
.kicker::before{content:"";width:22px;height:2px;border-radius:2px;background:var(--sky)}
html[lang="en"] .kicker{letter-spacing:.12em;text-transform:uppercase;font-size:12px}
h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.4vw,40px);line-height:1.3;margin:0;text-wrap:balance}
html[lang="en"] h2{font-weight:800;letter-spacing:-.025em;line-height:1.12}
.head p{color:var(--muted);margin:0;max-width:31em}

/* featured */
.feature{position:relative;display:grid;grid-template-columns:minmax(0,420px) minmax(0,1fr);align-items:end;border-radius:28px;margin:72px 0 44px;color:#fff;
  background:radial-gradient(80% 120% at 15% 100%,rgba(41,163,221,.32),transparent 60%),linear-gradient(135deg,#0f4993,#081a40 75%);box-shadow:var(--shadow)}
html[dir="rtl"] .feature{background:radial-gradient(80% 120% at 85% 100%,rgba(41,163,221,.32),transparent 60%),linear-gradient(225deg,#0f4993,#081a40 75%)}
.feature .ph{position:relative;align-self:stretch;display:flex;justify-content:center;align-items:flex-end;min-height:360px}
.feature .ph img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:calc(100% + 64px);width:auto;max-width:none;filter:drop-shadow(0 24px 40px rgba(0,0,0,.4))}
.feature .body{padding:48px 52px 48px 20px;display:flex;flex-direction:column;gap:10px;min-width:0}
html[dir="rtl"] .feature .body{padding:48px 20px 48px 52px}
.badge{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:700;color:#d6e4fb}
.badge svg{width:13px;height:13px;color:#7cd0f5}
.feature h3{margin:6px 0 0;font-family:var(--display);font-size:clamp(28px,3.2vw,40px);font-weight:700;line-height:1.3}
html[lang="en"] .feature h3{font-weight:800;letter-spacing:-.02em;line-height:1.1}
.feature .role{color:#8fd4f5;font-weight:600;font-size:17px;margin:0}
.feature .focus{color:#c2cfe9;margin:0;max-width:40em}
.creds{display:flex;flex-wrap:wrap;gap:6px;direction:ltr;justify-content:flex-start}
html[dir="rtl"] .creds{justify-content:flex-end}
.creds span{font:700 11.5px/1 var(--latin);letter-spacing:.05em;padding:6px 9px;border-radius:7px;background:var(--brand-soft);color:var(--brand)}
.feature .creds span{background:rgba(255,255,255,.1);color:#e4ecfb}
.feature .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.feature .phone{font:800 26px/1 var(--latin);font-variant-numeric:tabular-nums;direction:ltr;margin-inline-end:12px;user-select:all}

/* filters */
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{all:unset;cursor:pointer;padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:14px;color:var(--muted);transition:all .2s}
.chips button:hover{border-color:var(--brand);color:var(--text)}
.chips button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.chips button:focus-visible{outline:2px solid var(--sky)}
.search{position:relative;min-width:0;flex:0 1 270px}
.search input{width:100%;padding:11px 16px 11px 40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px}
html[dir="rtl"] .search input{padding:11px 40px 11px 16px}
.search svg{position:absolute;top:50%;transform:translateY(-50%);inset-inline-start:13px;width:17px;height:17px;color:var(--muted)}

/* doctor cards */
.docs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}
.doc{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column;min-width:0;transition:transform .3s,box-shadow .3s}
.doc:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
.doc .ph{position:relative;aspect-ratio:1/1;max-width:100%;overflow:hidden;background:radial-gradient(75% 70% at 50% 35%,var(--ph-a),var(--ph-b));cursor:pointer;border:0;padding:0;width:100%;display:block}
.doc .ph::after{content:"";position:absolute;inset:auto 0 0;height:30%;background:linear-gradient(transparent,color-mix(in srgb,var(--ph-b) 70%,transparent))}
.doc .ph img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:94%;width:auto;max-width:none;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform-origin:50% 100%}
.doc:hover .ph img{transform:translateX(-50%) scale(1.04)}
.doc .ph .tag{position:absolute;z-index:1;top:12px;inset-inline-start:12px;background:color-mix(in srgb,var(--surface) 85%,transparent);backdrop-filter:blur(8px);color:var(--brand);font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:999px}
.mono{position:absolute;inset:0;display:grid;place-items:center}
.mono span{width:46%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:linear-gradient(150deg,#0f4993,#081a40);color:#fff;font:700 clamp(28px,4vw,44px)/1 var(--latin);letter-spacing:.04em;box-shadow:0 18px 40px -18px rgba(8,26,64,.6),inset 0 0 0 6px rgba(255,255,255,.08)}
.doc .body{padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.doc h3{margin:0;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.45}
html[lang="en"] .doc h3{font-size:17.5px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.doc .role{margin:0;color:var(--brand);font-size:13.5px;font-weight:600;line-height:1.55}
.doc .creds{margin-top:4px}
.doc .creds span{font-size:10.5px;padding:5px 7px}
.doc .foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.doc .foot a.num{text-decoration:none;font-weight:800;font-size:15px;color:var(--text)}
.doc .foot small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.icons{display:flex;gap:6px}
.ib{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line);color:var(--brand);background:var(--surface)}
.ib:hover{background:var(--brand-soft)}
.ib.solid{background:var(--royal);border-color:var(--royal);color:#fff}
.ib.solid:hover{filter:brightness(1.12)}
.ib:focus-visible{outline:2px solid var(--sky)}
.ib svg{width:15px;height:15px}
.more{all:unset;cursor:pointer;font-size:13px;font-weight:600;color:var(--brand);margin-top:2px;align-self:flex-start}
.more:hover{text-decoration:underline}
.more:focus-visible{outline:2px solid var(--sky)}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}

/* dialog */
dialog{border:0;padding:0;border-radius:24px;max-width:min(860px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--text);box-shadow:0 40px 100px -30px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,12,30,.6);backdrop-filter:blur(4px)}
.dlg{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr)}
.dlg .ph{position:relative;min-height:380px;background:radial-gradient(80% 70% at 50% 35%,#1b5bb0,#081a40)}
.dlg .ph img{position:absolute;bottom:0;left:50%;transform:translateX(-50%);height:92%;width:auto;max-width:none}
.dlg .ph .mono span{background:rgba(255,255,255,.1)}

.sl-stage img.to-prev{transform:translateX(-120%);opacity:0}

/* ================= Premium layer ================= */
:root{--r-lg:28px;--r-md:20px;--shadow-soft:0 1px 2px rgba(8,26,64,.05),0 18px 40px -24px rgba(8,26,64,.28);--shadow-lift:0 2px 4px rgba(8,26,64,.06),0 36px 70px -30px rgba(8,26,64,.42)}
body{background:var(--bg)}
::selection{background:color-mix(in srgb,var(--sky) 35%,transparent)}
/* header */
.bar{transition:box-shadow .3s,background .3s}
.bar.scrolled{box-shadow:0 10px 30px -18px rgba(8,26,64,.35)}
.nav a{position:relative}
.nav a::after{content:"";position:absolute;inset-inline:13px;bottom:4px;height:2px;border-radius:2px;background:var(--sky);transform:scaleX(0);transition:transform .25s}
.nav a:hover::after{transform:scaleX(1)}
.nav a:hover{background:transparent}
.er{background:linear-gradient(135deg,#1f6fc4,#0f4993);box-shadow:0 10px 24px -12px rgba(15,73,147,.8)}
/* hero */
.hero{padding-bottom:84px;background:radial-gradient(55% 70% at 78% 30%,rgba(41,163,221,.30),transparent 62%),radial-gradient(60% 90% at 15% 115%,rgba(15,73,147,.95),transparent 60%),linear-gradient(160deg,#0d2d69 0%,#081a40 62%,#061331 100%)}
html[dir="rtl"] .hero{background:radial-gradient(55% 70% at 22% 30%,rgba(41,163,221,.30),transparent 62%),radial-gradient(60% 90% at 85% 115%,rgba(15,73,147,.95),transparent 60%),linear-gradient(200deg,#0d2d69 0%,#081a40 62%,#061331 100%)}
.hero .wrap{min-height:min(700px,calc(100vh - 150px));z-index:2}
.hero .copy{padding-block:56px 40px}
.hero h1{font-size:clamp(36px,5.2vw,68px);line-height:1.22;margin:22px 0 20px}
html[lang="en"] .hero h1{line-height:1.04;letter-spacing:-.035em}
.lead{font-size:18px;line-height:1.8;color:#bccbe8}
.pill{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.16);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:8px 14px}
.pill i{box-shadow:0 0 0 4px rgba(41,163,221,.25)}
.cta .btn{padding:15px 24px;border-radius:14px;font-size:15.5px}
.btn-white{box-shadow:0 14px 30px -14px rgba(0,0,0,.5)}
.btn-white:hover{box-shadow:0 18px 36px -14px rgba(0,0,0,.6)}
.orb{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;z-index:0;opacity:.55}
.orb.o1{width:420px;height:420px;background:#1d7fd1;top:-140px;inset-inline-start:-120px;animation:orb 16s ease-in-out infinite alternate}
.orb.o2{width:360px;height:360px;background:#29a3dd;bottom:-160px;inset-inline-end:18%;opacity:.28;animation:orb 20s ease-in-out infinite alternate-reverse}
@keyframes orb{to{transform:translate(60px,40px) scale(1.12)}}
.ecg{position:absolute;inset-inline:0;bottom:66px;width:100%;height:90px;z-index:1;pointer-events:none;opacity:.5}
.ecg path{fill:none;stroke:url(#none);stroke:#7cd0f5;stroke-width:1.6;stroke-dasharray:2200;stroke-dashoffset:2200;animation:ecg 6s cubic-bezier(.4,0,.2,1) infinite;filter:drop-shadow(0 0 6px rgba(124,208,245,.8))}
html[dir="rtl"] .ecg{transform:scaleX(-1)}
@keyframes ecg{0%{stroke-dashoffset:2200;opacity:0}8%{opacity:1}55%{stroke-dashoffset:0;opacity:1}80%,100%{stroke-dashoffset:0;opacity:0}}
.hero .stats{margin-top:38px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:600px}
.hero .stat{border:1px solid rgba(255,255,255,.12);background:linear-gradient(160deg,rgba(255,255,255,.09),rgba(255,255,255,.03));border-radius:16px;padding:14px 14px 12px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero .stat:first-child{padding-inline-start:14px;border-inline-start:1px solid rgba(255,255,255,.12)}
.hero .stat b{color:#fff;font-size:26px}
.hero .stat span{color:#a9bde0;font-size:12.5px;line-height:1.45;margin-top:4px}
.slider{z-index:2}
/* finder overlapping hero */
.finder-wrap{margin-top:-60px;position:relative;z-index:6;padding:0;background:transparent;border:0}
.finder{border-radius:22px;border-color:transparent;box-shadow:0 30px 70px -30px rgba(8,26,64,.55),0 0 0 1px rgba(8,26,64,.06)}
.finder .f{padding:20px 24px}
.finder .go .btn{border-radius:14px}
/* sections */
section{padding-block:104px}
#doctors{padding-top:88px}
.head{margin-bottom:42px}
h2{font-size:clamp(30px,3.9vw,50px);line-height:1.22}
html[lang="en"] h2{line-height:1.06;letter-spacing:-.035em}
.kicker{padding:6px 13px 6px 11px;border-radius:999px;background:var(--brand-soft);margin-bottom:14px;font-size:13px}
.kicker::before{width:7px;height:7px;border-radius:50%;background:var(--sky);box-shadow:0 0 0 3px color-mix(in srgb,var(--sky) 25%,transparent)}
html[lang="en"] .kicker{font-size:11.5px}
.head p{font-size:16.5px;line-height:1.75}
.kicker.light{background:rgba(255,255,255,.08)}
/* doctor cards */
.docs{gap:24px}
.doc{border-radius:24px;border-color:transparent;box-shadow:var(--shadow-soft);transition:transform .45s cubic-bezier(.2,.7,.2,1),box-shadow .45s}
.doc:hover{transform:translateY(-6px);box-shadow:var(--shadow-lift)}
.doc .ph{background:radial-gradient(80% 75% at 50% 30%,#ffffff,#e3edf9 60%,#cddcf0)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .doc .ph{background:radial-gradient(80% 75% at 50% 30%,#1b2d58,#0c1733)}}
.doc:hover .ph img{transform:translateX(-50%) scale(1.04)}
.doc:hover .ph img.cover{transform:scale(1.04)}
.doc .body{padding:20px 20px 18px}
.doc h3{font-size:17.5px}
.chips button{padding:9px 17px;font-weight:600}
.search input{border-radius:14px;padding-block:12px}
/* tips */
.tipbox{border-radius:32px;box-shadow:var(--shadow-lift)}
/* departments — dark showcase */
.depts{position:relative;overflow:hidden;color:#fff;border:0;background:radial-gradient(50% 60% at 85% 0%,rgba(41,163,221,.22),transparent 60%),radial-gradient(60% 70% at 0% 100%,rgba(15,73,147,.7),transparent 60%),linear-gradient(170deg,#0c2a63,#071534 75%)}
.depts::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(60% 70% at 50% 30%,#000,transparent);-webkit-mask-image:radial-gradient(60% 70% at 50% 30%,#000,transparent)}
.depts .wrap{position:relative}
.depts h2{color:#fff}
.depts .head p{color:#a9bde0}
.depts .kicker{background:rgba(255,255,255,.08);color:#9fd8f5}
.dgrid{gap:16px;counter-reset:dp}
.dept{position:relative;overflow:hidden;border-radius:22px;padding:28px 24px 26px;border:1px solid rgba(255,255,255,.1);background:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.02));transition:transform .4s cubic-bezier(.2,.7,.2,1),border-color .3s,background .3s}
.dept:hover{transform:translateY(-5px);border-color:rgba(124,208,245,.45);background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.03))}
.dept::after{counter-increment:dp;content:"0" counter(dp);position:absolute;top:24px;inset-inline-end:22px;font:800 13px/1 var(--latin);letter-spacing:.08em;color:rgba(255,255,255,.28)}
.dept .ico{width:52px;height:52px;border-radius:15px;background:linear-gradient(145deg,rgba(41,163,221,.3),rgba(41,163,221,.08));color:#8fdcff;box-shadow:inset 0 0 0 1px rgba(124,208,245,.25)}
.dept h3{color:#fff;font-size:17.5px;margin-top:6px}
.dept p{color:#a9bde0}
/* emergency band */
